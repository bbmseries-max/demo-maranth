<div class="p-6 md:p-10 min-h-screen bg-base">
  
  <!-- Page Header & Actions -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-3xl font-black text-main tracking-tight">Team</h1>
      <p class="text-main/60 mt-1">Manage staff roles, access, and shifts.</p>
    </div>
    
    <div class="flex gap-3">
      <!-- Primary Action Button -->
      <button class="bg-brand text-white px-6 py-3 rounded-xl font-bold shadow-md hover:opacity-90 active:scale-95 transition-all whitespace-nowrap flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path></svg>
        Add Member
      </button>
    </div>
  </div>

  <!-- Team Member Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    
    @for (member of team(); track member.id) {
      <div class="bg-surface border border-theme-border rounded-2xl p-6 flex flex-col items-center text-center shadow-sm hover:shadow-md hover:border-brand/50 transition-all group relative">
        
        <!-- Status Badge (Absolute positioned in the top right corner) -->
        <div class="absolute top-4 right-4 flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border border-theme-border/50 bg-base">
          <!-- The pulsing dot logic -->
          <span class="w-2 h-2 rounded-full" [class]="member.status === 'Active' ? 'bg-green-500 animate-pulse' : 'bg-main/30'"></span>
          <span class="text-main/80">{{ member.status }}</span>
        </div>

        <!-- Avatar / Initials -->
        <div class="w-20 h-20 bg-base text-brand border border-theme-border rounded-full flex items-center justify-center text-2xl font-black mb-4 mt-2 shadow-inner">
          {{ member.initials }}
        </div>

        <!-- Name & Role -->
        <h3 class="text-xl font-bold text-main">{{ member.name }}</h3>
        <p class="text-brand font-medium mt-1">{{ member.role }}</p>

        <!-- Divider -->
        <div class="w-full h-px bg-theme-border my-5"></div>

        <!-- Action Buttons -->
        <div class="w-full grid grid-cols-2 gap-3">
          <button class="flex items-center justify-center gap-2 py-2.5 rounded-xl text-main font-bold border border-theme-border hover:bg-base hover:text-brand transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            Edit
          </button>
          
          <button (click)="removeMember(member.id)" class="flex items-center justify-center gap-2 py-2.5 rounded-xl text-red-500 font-bold border border-theme-border/50 hover:bg-red-500 hover:text-white hover:border-red-500 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            Remove
          </button>
        </div>
        
      </div>
    }

  </div>
</div>
