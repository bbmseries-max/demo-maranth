<!-- TOP HEADER BAR -->
<header class="bg-surface border-b border-theme-border px-6 py-4 flex justify-between items-center sticky top-0 z-50">
  
  <!-- Brand / Logo -->
  <div class="text-brand font-black text-2xl tracking-tight">
   <app-logo size="sm" variant="compact"></app-logo>
  </div>

  <!-- DESKTOP MENU (Hidden on mobile, visible on tablet/PC) -->
  <nav class="hidden md:flex items-center gap-2">
    <a routerLink="/pos" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Ταμίο
    </a>
    <a routerLink="/inventory" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Αποθήκη
    </a>
    <a routerLink="/team" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Ταμίας
    </a>
    <a routerLink="/dashboard" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Dashboard
    </a>
    <a routerLink="/settings" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Ρυθμίσεις
    </a>
    <a routerLink="/costumers" routerLinkActive="bg-brand text-white shadow-md" class="flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
      Πόντοι
    </a>
  </nav>

  <!-- MOBILE HAMBURGER BUTTON (Visible on mobile, hidden on tablet/PC) -->
  <button (click)="toggleMenu()" class="md:hidden p-2 text-brand bg-base rounded-lg hover:bg-theme-border transition-colors">
    <!-- Menu Icon (Shows when closed) -->
    @if (!isMobileMenuOpen()) {
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    } 
    <!-- Close Icon (Shows when open) -->
    @else {
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    }
  </button>
</header>

<!-- MOBILE SLIDE-DOWN MENU -->
@if (isMobileMenuOpen()) {
  <div class="md:hidden fixed inset-x-0 top-[73px] bottom-0 bg-surface z-40 p-4 border-t border-theme-border shadow-xl">
    <nav class="flex flex-col gap-2">
      <!-- (click)="closeMenu()" ensures the menu hides after making a selection -->
      <a (click)="closeMenu()" routerLink="/pos" routerLinkActive="bg-brand text-white shadow-md" class="flex 
      items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Ταμίο
      </a>
       <a (click)="closeMenu()" routerLink="/inventory" routerLinkActive="bg-brand text-white shadow-md" class="flex 
       items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Αποθήκη
      </a>
      <a (click)="closeMenu()" routerLink="/team" routerLinkActive="bg-brand text-white shadow-md" class="flex 
      items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Ταμύας
      </a>
      <a (click)="closeMenu()" routerLink="/dashboard" routerLinkActive="bg-brand text-white shadow-md" class="flex 
      items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Dashboard
      </a>
      <a (click)="closeMenu()" routerLink="/settings" routerLinkActive="bg-brand text-white shadow-md" class="flex 
      items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Ρυθμίσεις
      </a>
       <a (click)="closeMenu()" routerLink="/costumers" routerLinkActive="bg-brand text-white shadow-md" class="flex 
       items-center gap-3 px-4 py-4 rounded-xl font-bold text-main/60 hover:text-main hover:bg-base transition-all">
        Πόντοι
      </a>
    </nav>
  </div>
}

<!-- MAIN CONTENT AREA -->
<main class="bg-base min-h-screen">
  <router-outlet></router-outlet>
</main>
